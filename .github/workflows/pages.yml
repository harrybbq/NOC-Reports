name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Gate the deploy on the suite: never publish a red build.
      - name: Run tests
        run: npm test

      - name: Build _site
        run: npm run build:site

      # Requires Pages to be switched on once, by hand, in
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # The workflow's GITHUB_TOKEN cannot create the Pages site itself
      # ("Resource not accessible by integration"), so this step fails until
      # that one-time toggle is done. Everything after it is automatic.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
